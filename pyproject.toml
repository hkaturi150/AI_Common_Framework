[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-core"
version = "1.0.0"
description = "Common AI engineering framework — LLM, RAG, Agents, Pipelines, FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "openai>=1.30",
    "anthropic>=0.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5",
    "pinecone-client>=3.0",
    "asyncpg>=0.29",
    "sentence-transformers>=2.7",
    "numpy>=1.26",
]
all = ["ai-core[rag]"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx",               # TestClient
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["ai_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
